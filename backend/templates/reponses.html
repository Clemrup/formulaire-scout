<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réponses enregistrées</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="/">← Retour au formulaire</a>
        <h2>Administration - Gestion des réponses</h2>
        <div style="margin-bottom: 20px;">
            <strong>Nombre de réponses :</strong> <span class="nb-reponses">{{ nb_reponses }}</span><br>
            <strong>Capacité maximale :</strong> {{ capacite }}<br>
            <form method="post" style="display:inline; margin-top:10px;">
                <button type="button" id="toggle-capacite">Modifier la capacité</button>
                <span id="capacite-controls" style="display:none; margin-left:8px;">
                    <input type="number" name="capacite" id="capacite" min="1" value="{{ capacite }}">
                    <button type="submit">Enregistrer</button>
                </span>
            </form>
        </div>

        <!-- Message dynamique pour la limite (géré par JS) -->
        <div id="alert-limite" style="color: red; font-weight: bold; margin-top:10px; display:none;">⚠️ Limite atteinte</div>
        <table id="reponsesTable">
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            <!-- LIGNES_REPONSES -->
        </table>

        <!-- Message dynamique pour aucune réponse (géré par JS) -->
        <p class="aucune-reponse" style="display:none;">Aucune réponse enregistrée pour le moment.</p>
    </div>
    <script src="/static/reponses.js"></script>
</body>
</html>
