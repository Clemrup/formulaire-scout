<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réponses enregistrées</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="/">← Retour au formulaire</a>
        <h2>Administration - Gestion des réponses</h2>
        <div style="margin-bottom: 20px;">
            <strong>Nombre de réponses :</strong> <span class="nb-reponses">{{ nb_reponses }}</span><br>
            <strong>Capacité maximale :</strong> {{ capacite }}<br>
            <form method="post" style="display:inline; margin-top:10px;">
                <button type="button" id="toggle-capacite">Modifier la capacité</button>
                <span id="capacite-controls" style="display:none; margin-left:8px;">
                    <input type="number" name="capacite" id="capacite" min="1" value="{{ capacite }}">
                    <button type="submit">Enregistrer</button>
                </span>
            </form>
        </div>

        <!-- Message dynamique pour la limite (géré par JS) -->
        <div id="alert-limite" style="color: red; font-weight: bold; margin-top:10px; display:none;">⚠️ Limite atteinte</div>
        <table id="reponsesTable">
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            <!-- LIGNES_REPONSES -->
        </table>

        <!-- Message dynamique pour aucune réponse (géré par JS) -->
        <p class="aucune-reponse" style="display:none;">Aucune réponse enregistrée pour le moment.</p>
    </div>
    <script>
        // Fonction pour mettre à jour dynamiquement le nombre de réponses, l'alerte et le message vide
        async function updateInfos() {
            const res = await fetch('/api/places_restantes');
            if (res.ok) {
                const data = await res.json();
                // Met à jour le nombre de réponses
                let nbReponsesElem = document.querySelector('.nb-reponses');
                if (nbReponsesElem) {
                    // Si l'API renvoie nb_reponses, l'utiliser, sinon calculer
                    if (typeof data.nb_reponses !== 'undefined') {
                        nbReponsesElem.textContent = data.nb_reponses;
                    } else {
                        nbReponsesElem.textContent = data.capacite - data.places_restantes;
                    }
                }
                // Affiche ou masque le message "aucune réponse"
                const table = document.getElementById('reponsesTable');
                const msg = document.querySelector('.aucune-reponse');
                if (table && table.rows.length === 1) {
                    msg.style.display = '';
                } else {
                    msg.style.display = 'none';
                }
                // Affiche ou masque l'alerte limite
                const alert = document.getElementById('alert-limite');
                if (data.places_restantes === 0) {
                    alert.style.display = 'block';
                } else {
                    alert.style.display = 'none';
                }
            }
        }
        // Appel initial pour afficher correctement les messages au chargement
        updateInfos();
        // Suppression
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                if (!confirm('Supprimer cette réponse ?')) return;
                const tr = this.closest('tr');
                const id = tr.getAttribute('data-id');
                await fetch(`/reponses/supprimer/${id}`, { method: 'POST' });
                tr.remove();
                await updateInfos(); // <-- met à jour l'affichage dynamique
            });
        });
        // Edition
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const tr = this.closest('tr');
                const nomTd = tr.querySelector('.nom');
                const prenomTd = tr.querySelector('.prenom');
                const emailTd = tr.querySelector('.email');
                const oldNom = nomTd.textContent;
                const oldPrenom = prenomTd.textContent;
                const oldEmail = emailTd ? emailTd.textContent : '';
                const nomInput = document.createElement('input');
                nomInput.type = 'text';
                nomInput.value = oldNom;
                nomTd.textContent = '';
                nomTd.appendChild(nomInput);

                const prenomInput = document.createElement('input');
                prenomInput.type = 'text';
                prenomInput.value = oldPrenom;
                prenomTd.textContent = '';
                prenomTd.appendChild(prenomInput);

                let emailInput = null;
                if (emailTd) {
                    emailInput = document.createElement('input');
                    emailInput.type = 'email';
                    emailInput.value = oldEmail;
                    emailTd.textContent = '';
                    emailTd.appendChild(emailInput);
                }
                this.style.display = 'none';
                const saveBtn = document.createElement('button');
                saveBtn.textContent = 'Enregistrer';
                saveBtn.className = 'save-btn';
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Annuler';
                cancelBtn.className = 'cancel-btn';
                this.parentNode.appendChild(saveBtn);
                this.parentNode.appendChild(cancelBtn);
                cancelBtn.addEventListener('click', function() {
                    nomTd.textContent = oldNom;
                    prenomTd.textContent = oldPrenom;
                    btn.style.display = '';
                    saveBtn.remove();
                    cancelBtn.remove();
                });
                saveBtn.addEventListener('click', async function() {
                    const newNom = nomTd.querySelector('input').value;
                    const newPrenom = prenomTd.querySelector('input').value;
                    const newEmail = emailTd ? (emailTd.querySelector('input') ? emailTd.querySelector('input').value : '') : '';
                    const id = tr.getAttribute('data-id');
                    const payload = { nom: newNom, prenom: newPrenom };
                    payload.email = newEmail;
                    const res = await fetch(`/reponses/modifier/${id}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        nomTd.textContent = newNom;
                        prenomTd.textContent = newPrenom;
                        emailTd.textContent = newEmail;
                        btn.style.display = '';
                        saveBtn.remove();
                        cancelBtn.remove();
                        await updateInfos(); // <-- met à jour l'affichage dynamique
                    } else {
                        alert('Erreur lors de la modification');
                    }
                });
            });
        });

        // Toggle capacity input visibility
        const toggleBtn = document.getElementById('toggle-capacite');
        const capaciteControls = document.getElementById('capacite-controls');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                if (!capaciteControls) return;
                const isHidden = getComputedStyle(capaciteControls).display === 'none';
                capaciteControls.style.display = isHidden ? 'inline-block' : 'none';
                if (isHidden) {
                    const capInput = document.getElementById('capacite');
                    if (capInput) { setTimeout(() => capInput.focus(), 50); }
                }
            });
        }
    </script>
</body>
</html>
