<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réponses enregistrées</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="/">← Retour au formulaire</a>
        <h2>Administration - Gestion des réponses</h2>
        <div style="margin-bottom: 20px;">
            <strong>Nombre de réponses :</strong> <span class="nb-reponses">...</span><br>
            <strong>Capacité maximale :</strong> <span class="capacite">...</span><br>
            <form method="post" style="display:inline; margin-top:10px;">
                <button type="button" id="toggle-capacite">Modifier la capacité</button>
                <span id="capacite-controls" style="display:none; margin-left:8px;">
                    <input type="number" name="capacite" id="capacite" min="1" value="1">
                    <button type="button">Enregistrer</button>
                </span>
            </form>
            <button type="button" id="btn-export-emails" style="margin-left: 20px; padding: 8px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">📧 Exporter emails uniques</button>
        </div>

        <!-- Message dynamique pour la limite (géré par JS) -->
        <div id="alert-limite" style="color: red; font-weight: bold; margin-top:10px; display:none;">⚠️ Limite atteinte</div>
        <div class="table-responsive">
            <table id="reponsesTable">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
                <!-- LIGNES_REPONSES -->
            </table>
        </div>

        <!-- Message dynamique pour aucune réponse (géré par JS) -->
        <p class="aucune-reponse" style="display:none;">Aucune réponse enregistrée pour le moment.</p>
    </div>

    <!-- Modal pour afficher les emails uniques -->
    <div id="modal-emails" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.4); z-index:1000;">
        <div style="background-color:white; margin:5% auto; padding:20px; border-radius:8px; width:80%; max-height:80vh; overflow-y:auto; box-shadow:0 4px 8px rgba(0,0,0,0.2);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0;">Emails uniques (<span id="count-emails">0</span>)</h3>
                <button id="close-modal" type="button" style="background:none; border:none; font-size:24px; cursor:pointer;">×</button>
            </div>
            <div style="margin-bottom:10px;">
                <button id="copy-emails" type="button" style="padding:8px 15px; background-color:#2196F3; color:white; border:none; border-radius:4px; cursor:pointer; margin-right:10px;">📋 Copier tous</button>
                <button id="download-emails" type="button" style="padding:8px 15px; background-color:#FF9800; color:white; border:none; border-radius:4px; cursor:pointer;">⬇️ Télécharger CSV</button>
            </div>
            <table style="width:100%; border-collapse:collapse; margin-top:15px;">
                <thead>
                    <tr style="background-color:#f2f2f2; border-bottom:2px solid #ddd;">
                        <th style="padding:10px; text-align:left;">#</th>
                        <th style="padding:10px; text-align:left;">Email</th>
                    </tr>
                </thead>
                <tbody id="emails-list">
                </tbody>
            </table>
        </div>
    </div>

    <script src="/static/reponses.js"></script>
</body>
</html>
