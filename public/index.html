<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Présence rétro Compa'venThuriers</title>
</head>
<body>
    <main class="content">
    <div class="container">
        <h1 style="margin: 0;">Formulaire présence</h1>
        <h2 style="margin: 0; font-size: 1.3em;">Rétro des Compa'venThuriers </h2>
        <h2 style="margin: 0; margin-top: 1.1em; font-size: 1.1em;">Le Samedi 11 avril 2026 à 19h00</h2>
        <h3 style="margin-top: 0; font-size: 0.9em; margin-bottom: 20px;">Lieu : CSRA (Centre Sportif Régional Alsace)<br>
                5 Rue des Frères Lumière<br>
                68100 Mulhouse</h3>

        <div class="places-restantes" style="margin-bottom:10px;">
            Chargement...
        </div>
        <form id="formulaire">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" required>
            <label for="email">Adresse e-mail :</label>
            <input type="email" id="email" name="email" required>
            <button type="submit">Envoyer</button>
        </form>
        <div class="success" id="successMsg" style="display:none;">Réponse enregistrée !</div>
        <div class="error" id="errorMsg" style="display:none; color:red; margin-top:10px;"></div>

        <div class="video-section">
            <h3>Bande annonce</h3>
            <div class="video-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Bande annonce rétro" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    </main>
    
    <footer class="site-footer">
        &copy; 2026 Compa'venThuriers. Tous droits réservés.
        <button id="admin-btn">Admin</button>
    </footer>
    <script src="/static/script.js"></script>
</body>
</html>
